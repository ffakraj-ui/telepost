name: Post APK to Telegram

on:
  # Manual: Actions tab -> "Run workflow" -> repo/release fields bhar ke chalao
  workflow_dispatch:
    inputs:
      repo:
        description: "Repo (e.g. ffakraj-ui/apps) — khaali chhodo automatic mode ke liye"
        required: false
        type: string
      release_id:
        description: "Release ID (optional)"
        required: false
        type: string
      release_tag:
        description: "Release tag e.g. v1.0 (optional, release_id ke bina)"
        required: false
        type: string
      asset_name:
        description: "Specific APK filename (optional, khaali = pehla APK)"
        required: false
        type: string
      limit:
        description: "Ek run me max kitne APK bhejne hain (default 10, max 50)"
        required: false
        type: string
        default: "10"
      dry_run:
        description: "Dry run (post nahi karega, sirf preview)"
        required: false
        type: boolean
        default: false

  # Automatic: har 30 minute me naye releases check karo
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install fonts
        run: sudo apt-get update -y && sudo apt-get install -y fonts-dejavu-core fonts-liberation fonts-roboto

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run poster
        env:
          CONFIG_JSON: ${{ secrets.CONFIG_JSON }}
        run: |
          ARGS=""
          if [ -n "${{ inputs.repo }}" ]; then ARGS="$ARGS --repo ${{ inputs.repo }}"; fi
          if [ -n "${{ inputs.release_id }}" ]; then ARGS="$ARGS --release-id ${{ inputs.release_id }}"; fi
          if [ -n "${{ inputs.release_tag }}" ]; then ARGS="$ARGS --release-tag ${{ inputs.release_tag }}"; fi
          if [ -n "${{ inputs.asset_name }}" ]; then ARGS="$ARGS --asset-name \"${{ inputs.asset_name }}\""; fi
          LIMIT="${{ inputs.limit }}"
          if [ -z "$LIMIT" ]; then LIMIT="10"; fi
          ARGS="$ARGS --limit $LIMIT"
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          eval python scripts/post_apk.py $ARGS

      - name: Commit updated posted.json
        run: |
          git config --global user.name "telepost-bot"
          git config --global user.email "actions@github.com"
          git add posted.json
          git diff --cached --quiet || git commit -m "Update posted list [skip ci]"
          git push
